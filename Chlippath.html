<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .triangle{
            height: 200px;
            width: 200px;
            background-color: blanchedalmond;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            ;
        }

        .trapezoid{
           
              height: 200px;
            width: 200px;
            background-color: rgb(190, 71, 31);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            margin-top: 50px;

        }
        .parallelogram{
            height: 200px;
            width: 200px;
            background-color: rgb(31, 190, 150);
            clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);
            margin-top: 50px;
        }
        .rhombus{
            height: 200px;
            width: 200px;
            background-color: rgb(63, 66, 65);
          clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            margin-top: 50px;
        }

        .pentagon{
            height: 200px;
            width: 200px;
            background-color: rgb(63, 45, 155);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            margin-top: 50px;

        }
.hexagon{
     height: 200px;
            width: 200px;
            background-color: rgb(155, 163, 188);
                margin-top: 50px;
                clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
}
.heotagon{
    height: 200px;
            width: 200px;
            background-color: rgb(22, 181, 38);
                margin-top: 50px;
                clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
}
.octagon{
    height: 200px;
            width: 200px;
            background-color: rgb(181, 22, 112);
                margin-top: 50px;
                clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
}
.nanogon{
    height: 200px;
            width: 200px;
            background-color: rgb(69, 79, 117);
                margin-top: 50px;
                clip-path: polygon(50% 0%, 83% 12%, 100% 43%, 94% 78%, 68% 100%, 32% 100%, 6% 78%, 0% 43%, 17% 12%);
}

.decago{
    height: 200px;
            width: 200px;
            background-color: rgb(133, 210, 26);
                margin-top: 50px;
                clip-path: polygon(50% 0%, 80% 10%, 100% 35%, 100% 70%, 80% 90%, 50% 100%, 20% 90%, 0% 70%, 0% 35%, 20% 10%);
}

.bevel{
     height: 200px;
            width: 200px;
            background-color: rgb(133, 210, 26);
                margin-top: 50px;
                clip-path: polygon(20% 0%, 80% 0%, 100% 20%, 100% 80%, 80% 100%, 20% 100%, 0% 80%, 0% 20%);  
}

.rabbet{
     height: 200px;
            width: 200px;
            background-color: rgb(133, 210, 26);
                margin-top: 50px;
                clip-path: polygon(0% 15%, 15% 15%, 15% 0%, 85% 0%, 85% 15%, 100% 15%, 100% 85%, 85% 85%, 85% 100%, 15% 100%, 15% 85%, 0% 85%);

}

.left-arrow{
     height: 200px;
            width: 200px;
            background-color: rgb(133, 210, 26);
                margin-top: 50px;
                clip-path: polygon(40% 0%, 40% 20%, 100% 20%, 100% 80%, 40% 80%, 40% 100%, 0% 50%);

}
    </style>
</head>
<body>
    <div class="triangle"></div>
    
    <div class="trapezoid"></div>

    <div class="parallelogram"></div>

    <div class="rhombus"></div>

    <div class="pentagon"></div>

    <div class="hexagon"></div>

    <div class="heotagon"></div>

    <div class="octagon"></div>

    <div class="nanogon"></div>

<div class="decago"></div>

<div class="bevel"></div>

<div class="rabbet"></div>

<div class="left-arrow"></div>

<div class="right-arrow"></div>

</body>
</html>
